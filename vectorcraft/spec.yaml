schemaVersion: "2"
kind: mixin
name: vectorcraft
displayName: VectorCraft
permissions:
  network:
    allow:
      # Release tarball: github.com redirects to the release-assets CDN.
      - github.com:443
      - release-assets.githubusercontent.com:443
      - objects.githubusercontent.com:443
setup:
  install:
    # The prebuilt release links only against libc/libm/libgcc_s; everything
    # graphical is loaded with dlopen at runtime, so apt has to be told about it.
    # winit needs libwayland-client and libxkbcommon. The UI renders through
    # wgpu, and the sandbox has no GPU, so Mesa's lavapipe (mesa-vulkan-drivers)
    # supplies a software Vulkan device; the EGL/GL packages are wgpu's GL
    # fallback. All of this is only used when the sandbox has --display; the
    # headless MCP server needs none of it.
    - command: |
        set -eux
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y \
          ca-certificates \
          curl \
          libwayland-client0 \
          libwayland-cursor0 \
          libwayland-egl1 \
          libxkbcommon0 \
          libvulkan1 \
          mesa-vulkan-drivers \
          libegl1 \
          libegl-mesa0 \
          libgl1 \
          libgles2 \
          libgbm1 \
          libgl1-mesa-dri
        rm -rf /var/lib/apt/lists/*

    # VectorCraft from the upstream GitHub release. The Linux tarball ships both the
    # desktop app (`vectorcraft`) and the CLI (`vectorcraft-cli`) that hosts the MCP
    # server. Pinned and checksum-verified against the release's SHA256SUMS.txt.
    - command: |
        set -eux
        VERSION=0.7.0
        case "$(uname -m)" in
          aarch64|arm64) ARCH=aarch64 ;;
          x86_64|amd64)  ARCH=x86_64 ;;
          *) echo "vectorcraft: unsupported architecture $(uname -m)" >&2; exit 1 ;;
        esac
        NAME="vectorcraft-$VERSION-linux-$ARCH"
        BASE="https://github.com/storytold/vectorcraft/releases/download/v$VERSION"
        TMP=$(mktemp -d)
        curl -fsSL -o "$TMP/$NAME.tar.gz" "$BASE/$NAME.tar.gz"
        curl -fsSL -o "$TMP/SHA256SUMS.txt" "$BASE/SHA256SUMS.txt"
        (cd "$TMP" && grep " \*\?$NAME.tar.gz\$" SHA256SUMS.txt | sha256sum -c -)
        rm -rf /opt/vectorcraft
        mkdir -p /opt/vectorcraft
        tar -xzf "$TMP/$NAME.tar.gz" -C /opt/vectorcraft --strip-components=1 --no-same-owner
        rm -rf "$TMP"
        ln -sf /opt/vectorcraft/bin/vectorcraft-cli /usr/local/bin/vectorcraft-cli
        /usr/local/bin/vectorcraft-cli --version

    # Launchers. Written here rather than under `files:` because init files are
    # written after install commands run, and the MCP launcher has to exist
    # before the agent CLI is first started.
    #
    # `vectorcraft` opens the desktop app on the sandbox display with its control
    # channel on 127.0.0.1:7984, which is what the MCP server's connected mode talks to.
    #
    # `vectorcraft-mcp` is the command the agent CLI spawns. It picks the mode when it
    # starts: if the sandbox has a display it waits for the app's control port and
    # drives the live window (the user sees every change, and the window-only tools
    # work); otherwise, or if the app never comes up, it runs the in-process headless
    # engine, which has every document tool but no window tools. The CLI's connected
    # mode fails fast when nothing is listening, hence the wait.
    #
    # Without a flag `vectorcraft-cli mcp` tries 127.0.0.1:7979 and falls back to headless, so the
    # launcher always passes `--connect` or `--headless` explicitly.
    - command: |
        set -eux
        cat > /usr/local/bin/vectorcraft <<'LAUNCH'
        #!/bin/sh
        DISPLAY_DIR=/run/display
        DISPLAY_SOCK=wayland-0
        if [ ! -S "$DISPLAY_DIR/$DISPLAY_SOCK" ]; then
          echo "vectorcraft: display socket not found at $DISPLAY_DIR/$DISPLAY_SOCK" >&2
          echo "This sandbox was not created with --display, so the desktop app cannot open." >&2
          echo "The MCP server still works headless (vectorcraft-cli mcp)." >&2
          echo "" >&2
          echo "To get the window, enable the experimental display feature and recreate:" >&2
          echo "  sbx settings set platform.allowExperimentalFeatures true" >&2
          echo "  sbx settings set feature.sandbox-display true" >&2
          echo "  sbx create --display --kit <this-kit> shell <workspace>" >&2
          exit 1
        fi
        HOME_DIR=$(getent passwd 1000 | cut -d: -f6)
        if [ -z "$HOME_DIR" ]; then
          echo "vectorcraft: no user at uid 1000" >&2
          exit 1
        fi
        export HOME="$HOME_DIR"
        PORT="${VECTORCRAFT_CONTROL_PORT:-7984}"
        # A relative WAYLAND_DISPLAY resolved against XDG_RUNTIME_DIR works on
        # every libwayland; bare absolute socket paths need libwayland >= 1.21.
        export XDG_RUNTIME_DIR="$DISPLAY_DIR"
        export WAYLAND_DISPLAY="$DISPLAY_SOCK"
        # The app switches to X11 whenever DISPLAY is set; there is no X server.
        unset DISPLAY
        LAUNCH_DIR="$WORKSPACE_DIR"
        if [ -z "$LAUNCH_DIR" ]; then LAUNCH_DIR="$HOME_DIR"; fi
        cd "$LAUNCH_DIR" || exit 1
        exec /opt/vectorcraft/bin/vectorcraft --control "$PORT" "$@"
        LAUNCH

        cat > /usr/local/bin/vectorcraft-mcp <<'MCP'
        #!/bin/bash
        # VECTORCRAFT_MCP_MODE: auto (default), app, or headless.
        CLI=/opt/vectorcraft/bin/vectorcraft-cli
        PORT="${VECTORCRAFT_CONTROL_PORT:-7984}"
        MODE="${VECTORCRAFT_MCP_MODE:-auto}"
        WAIT="${VECTORCRAFT_MCP_WAIT:-20}"

        port_open() { (exec 3<>"/dev/tcp/127.0.0.1/$PORT") 2>/dev/null; }
        ready() { port_open; }
        connect() {
          echo "vectorcraft-mcp: driving the VectorCraft app on 127.0.0.1:$PORT" >&2
          exec "$CLI" mcp --connect "127.0.0.1:$PORT" "$@"
        }
        headless() {
          echo "vectorcraft-mcp: headless (no window)" >&2
          exec "$CLI" mcp --headless "$@"
        }

        [ "$MODE" = headless ] && headless "$@"
        if [ "$MODE" = app ] || [ -S /run/display/wayland-0 ]; then
          for _ in $(seq "$WAIT"); do
            ready && connect "$@"
            sleep 1
          done
          ready && connect "$@"
          echo "vectorcraft-mcp: no VectorCraft app on 127.0.0.1:$PORT after ${WAIT}s" >&2
        fi
        headless "$@"
        MCP
        chmod 0755 /usr/local/bin/vectorcraft /usr/local/bin/vectorcraft-mcp

    # Register the server with the sandbox's agent CLI at install time: install
    # commands finish during `sbx create`, before the CLI attaches, while startup
    # commands can fire after the session has already read its MCP config.
    - command: |
        set -e
        BIN_DIR="$HOME/.local/bin"
        mkdir -p "$BIN_DIR"
        cat > "$BIN_DIR/vectorcraft-mcp-register" <<'REGISTER'
        #!/bin/sh
        # Strictly additive: never remove-then-add. `claude mcp add` exits 1 on an
        # existing name, so a re-run is expected to fail and `|| true` leaves the
        # existing entry alone.
        PATH="$HOME/.local/bin:$HOME/.claude/local:/usr/local/share/npm-global/bin:$PATH"
        export PATH
        NAME=vectorcraft
        CMD=/usr/local/bin/vectorcraft-mcp

        if [ ! -x "$CMD" ]; then
          echo "vectorcraft-mcp-register: $CMD is missing" >&2
          exit 1
        fi

        found=0
        if command -v claude >/dev/null 2>&1; then
          found=1
          claude mcp add --scope user "$NAME" -- "$CMD" || true
          echo "vectorcraft-mcp-register: claude registration attempted for '$NAME'"
        fi
        if command -v codex >/dev/null 2>&1; then
          found=1
          codex mcp add "$NAME" -- "$CMD" || true
          echo "vectorcraft-mcp-register: codex registration attempted for '$NAME'"
        fi
        if [ "$found" -eq 0 ]; then
          echo "vectorcraft-mcp-register: no claude or codex CLI found, nothing to configure"
          echo "vectorcraft-mcp-register: launch manually with: $CMD"
        fi
        REGISTER
        chmod 0755 "$BIN_DIR/vectorcraft-mcp-register"
        "$BIN_DIR/vectorcraft-mcp-register"
      user: "agent"

  startup:
    # Fallback only; see the install-time registration above.
    - command:
        - sh
        - -c
        - /home/agent/.local/bin/vectorcraft-mcp-register >>/tmp/vectorcraft-mcp-register.log 2>&1 || true
      user: "agent"
      description: |
        Re-point the sandbox's agent CLI at the VectorCraft MCP server. A no-op for
        agents without a CLI (such as the plain shell agent).

    - command:
        - setpriv
        - --reuid=1000
        - --regid=1000
        - --init-groups
        - /bin/sh
        - -c
        - |
          if [ -S /run/display/wayland-0 ]; then
            exec /usr/local/bin/vectorcraft >>/tmp/vectorcraft-startup.log 2>&1
          fi
          echo "no display; not starting the VectorCraft window (MCP runs headless)" >>/tmp/vectorcraft-startup.log
      user: "0"
      background: true
      description: |
        Launch VectorCraft as a Wayland client with its control channel on
        127.0.0.1:7984, when the sandbox was created with --display. Runs as
        root then drops to uid 1000 via setpriv. Backgrounded so the agent's
        terminal keeps focus; output goes to /tmp/vectorcraft-startup.log.

agentInstructions:
  content: |
    ## VectorCraft

    VectorCraft (vector illustration, in the style of Illustrator) is installed, and
    its MCP server is registered as `vectorcraft`. The server's own `instructions`
    describe its tools; these notes cover how it is set up in this sandbox.
    Upstream: https://github.com/storytold/vectorcraft

    ### Which mode you are in

    The server logs its mode to stderr when it starts, and window-only tools say so
    when they fail:

    - **Connected** (sandbox has `--display`): you are driving the VectorCraft window
      the user can see, over its control channel on 127.0.0.1:7984. Everything you
      do shows up live, and the window tools (screenshots, clicks, menus, dialogs)
      work.
    - **Headless** (no display, or the app was not up within 20 s of the MCP server
      starting): an in-process engine. All document tools work; the window tools
      return an error.

    If the user closed the window, the connected server cannot reach the app.
    Relaunch it with `vectorcraft >>/tmp/vectorcraft-startup.log 2>&1 &` from the shell; the
    server reconnects on the next call.

    ### Working well

    - Discover commands with the server's command-list tool and run them by id
      rather than guessing parameters.
    - Look at the result (the server's render or screenshot tool) after visual
      changes instead of assuming they worked.
    - Always pass ABSOLUTE paths for opening, saving, importing and exporting. The
      app's working directory is the workspace, but the MCP server's may differ.
    - Save to the workspace so the user keeps the file.
    - The app's native file dialogs do not work in the sandbox. Never open
      Open/Save/Import dialogs through menus; use the path-taking tools instead.

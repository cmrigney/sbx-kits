schemaVersion: "2"
kind: mixin
name: photocraft
displayName: PhotoCraft
permissions:
  network:
    allow:
      # Release tarball: github.com redirects to the release-assets CDN.
      - github.com:443
      - release-assets.githubusercontent.com:443
      - objects.githubusercontent.com:443
setup:
  install:
    # The prebuilt release links only against libc/libm/libgcc_s; everything
    # graphical is loaded with dlopen at runtime, so apt has to be told about it.
    # winit needs libwayland-client and libxkbcommon. The UI renders through
    # wgpu, and the sandbox has no GPU, so Mesa's lavapipe (mesa-vulkan-drivers)
    # supplies a software Vulkan device; the EGL/GL packages are wgpu's GL
    # fallback. All of this is only used when the sandbox has --display; the
    # headless MCP server needs none of it.
    - command: |
        set -eux
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y \
          ca-certificates \
          curl \
          libwayland-client0 \
          libwayland-cursor0 \
          libwayland-egl1 \
          libxkbcommon0 \
          libvulkan1 \
          mesa-vulkan-drivers \
          libegl1 \
          libegl-mesa0 \
          libgl1 \
          libgles2 \
          libgbm1 \
          libgl1-mesa-dri \
          python3
        rm -rf /var/lib/apt/lists/*

    # PhotoCraft from the upstream GitHub release. The Linux tarball ships both the
    # desktop app (`photocraft`) and the CLI (`photocraft-cli`) that hosts the MCP
    # server. Pinned and checksum-verified against the release's SHA256SUMS.txt.
    - command: |
        set -eux
        VERSION=0.5.0
        case "$(uname -m)" in
          aarch64|arm64) ARCH=aarch64 ;;
          x86_64|amd64)  ARCH=x86_64 ;;
          *) echo "photocraft: unsupported architecture $(uname -m)" >&2; exit 1 ;;
        esac
        NAME="photocraft-$VERSION-linux-$ARCH"
        BASE="https://github.com/storytold/photocraft/releases/download/v$VERSION"
        TMP=$(mktemp -d)
        curl -fsSL -o "$TMP/$NAME.tar.gz" "$BASE/$NAME.tar.gz"
        curl -fsSL -o "$TMP/SHA256SUMS.txt" "$BASE/SHA256SUMS.txt"
        (cd "$TMP" && grep " \*\?$NAME.tar.gz\$" SHA256SUMS.txt | sha256sum -c -)
        rm -rf /opt/photocraft
        mkdir -p /opt/photocraft
        tar -xzf "$TMP/$NAME.tar.gz" -C /opt/photocraft --strip-components=1 --no-same-owner
        rm -rf "$TMP"
        ln -sf /opt/photocraft/bin/photocraft-cli /usr/local/bin/photocraft-cli
        /usr/local/bin/photocraft-cli --version

    # Launchers. Written here rather than under `files:` because init files are
    # written after install commands run, and the MCP launcher has to exist
    # before the agent CLI is first started.
    #
    # `photocraft` opens the desktop app on the sandbox display with its control
    # channel on 127.0.0.1:7878, which is what the MCP server's connected mode talks to.
    #
    # `photocraft-mcp` is the command the agent CLI spawns. It picks the mode when it
    # starts: if the sandbox has a display it waits for the app's control port and
    # drives the live window (the user sees every change, and the window-only tools
    # work); otherwise, or if the app never comes up, it runs the in-process headless
    # engine, which has every document tool but no window tools. The CLI's connected
    # mode fails fast when nothing is listening, hence the wait.
    #
    # The control channel needs a bearer token. The app creates
    # /home/agent/.local/state/photocraft/control.token (mode 0600) on first launch and the MCP
    # launcher reads the same file, so it waits for both the port and the token.
    #
    # The sandbox has no GPU, so PhotoCraft draws documents with its CPU compositor. Unless its
    # saved rendering mode is already CPU it then opens a modal "Switched to CPU rendering"
    # dialog in front of everything the agent does (`--safe-gpu` and PHOTOCRAFT_CPU_CANVAS do
    # not avoid it), so the launcher pins performance.renderingMode = "cpu" before each start.
    - command: |
        set -eux
        cat > /usr/local/bin/photocraft <<'LAUNCH'
        #!/bin/sh
        DISPLAY_DIR=/run/display
        DISPLAY_SOCK=wayland-0
        if [ ! -S "$DISPLAY_DIR/$DISPLAY_SOCK" ]; then
          echo "photocraft: display socket not found at $DISPLAY_DIR/$DISPLAY_SOCK" >&2
          echo "This sandbox was not created with --display, so the desktop app cannot open." >&2
          echo "The MCP server still works headless (photocraft-cli mcp)." >&2
          echo "" >&2
          echo "To get the window, enable the experimental display feature and recreate:" >&2
          echo "  sbx settings set platform.allowExperimentalFeatures true" >&2
          echo "  sbx settings set feature.sandbox-display true" >&2
          echo "  sbx create --display --kit <this-kit> shell <workspace>" >&2
          exit 1
        fi
        HOME_DIR=$(getent passwd 1000 | cut -d: -f6)
        if [ -z "$HOME_DIR" ]; then
          echo "photocraft: no user at uid 1000" >&2
          exit 1
        fi
        export HOME="$HOME_DIR"
        PORT="${PHOTOCRAFT_CONTROL_PORT:-7878}"
        STATE_DIR="$HOME/.local/state/photocraft"
        mkdir -p "$STATE_DIR" && chmod 700 "$STATE_DIR"
        # No GPU here: pin CPU rendering so PhotoCraft does not open its modal
        # "Switched to CPU rendering" dialog on every start. Merged, so the user's
        # other preferences survive.
        python3 - "$HOME/.config/photocraft/preferences.json" <<'PY' || true
        import json, os, sys
        path = sys.argv[1]
        try:
            prefs = json.load(open(path))
        except (OSError, ValueError):
            prefs = {}
        if prefs.get("performance", {}).get("renderingMode") != "cpu":
            prefs.setdefault("performance", {})["renderingMode"] = "cpu"
            os.makedirs(os.path.dirname(path), exist_ok=True)
            with open(path, "w") as f:
                json.dump(prefs, f, indent=2)
        PY
        # A relative WAYLAND_DISPLAY resolved against XDG_RUNTIME_DIR works on
        # every libwayland; bare absolute socket paths need libwayland >= 1.21.
        export XDG_RUNTIME_DIR="$DISPLAY_DIR"
        export WAYLAND_DISPLAY="$DISPLAY_SOCK"
        # The app switches to X11 whenever DISPLAY is set; there is no X server.
        unset DISPLAY
        LAUNCH_DIR="$WORKSPACE_DIR"
        if [ -z "$LAUNCH_DIR" ]; then LAUNCH_DIR="$HOME_DIR"; fi
        cd "$LAUNCH_DIR" || exit 1
        # Automation (the control channel, so the agent) can read and write files only
        # under these roots; without them doc_open/doc_save/doc_export are all refused.
        # The app reads both variables itself.
        export PHOTOCRAFT_AUTOMATION_READ_ROOT="${PHOTOCRAFT_AUTOMATION_READ_ROOT:-$LAUNCH_DIR}"
        export PHOTOCRAFT_AUTOMATION_WRITE_ROOT="${PHOTOCRAFT_AUTOMATION_WRITE_ROOT:-$LAUNCH_DIR}"
        exec /opt/photocraft/bin/photocraft --control "$PORT" --control-token-file "$STATE_DIR/control.token" "$@"
        LAUNCH

        cat > /usr/local/bin/photocraft-mcp <<'MCP'
        #!/bin/bash
        # PHOTOCRAFT_MCP_MODE: auto (default), app, or headless.
        CLI=/opt/photocraft/bin/photocraft-cli
        PORT="${PHOTOCRAFT_CONTROL_PORT:-7878}"
        MODE="${PHOTOCRAFT_MCP_MODE:-auto}"
        WAIT="${PHOTOCRAFT_MCP_WAIT:-20}"
        TOKEN_FILE="$HOME/.local/state/photocraft/control.token"
        # File roots for the headless engine (it ignores the environment variables, so
        # they are passed as flags). In bridge mode the desktop app's roots apply.
        READ_ROOT="${PHOTOCRAFT_AUTOMATION_READ_ROOT:-${WORKSPACE_DIR:-$PWD}}"
        WRITE_ROOT="${PHOTOCRAFT_AUTOMATION_WRITE_ROOT:-${WORKSPACE_DIR:-$PWD}}"

        port_open() { (exec 3<>"/dev/tcp/127.0.0.1/$PORT") 2>/dev/null; }
        ready() { port_open && [ -s "$TOKEN_FILE" ]; }
        connect() {
          echo "photocraft-mcp: driving the PhotoCraft app on 127.0.0.1:$PORT" >&2
          exec "$CLI" mcp --bridge "127.0.0.1:$PORT" --control-token-file "$TOKEN_FILE" "$@"
        }
        headless() {
          echo "photocraft-mcp: headless (no window)" >&2
          exec "$CLI" mcp --automation-read-root "$READ_ROOT" --automation-write-root "$WRITE_ROOT" "$@"
        }

        [ "$MODE" = headless ] && headless "$@"
        if [ "$MODE" = app ] || [ -S /run/display/wayland-0 ]; then
          for _ in $(seq "$WAIT"); do
            ready && connect "$@"
            sleep 1
          done
          ready && connect "$@"
          echo "photocraft-mcp: no PhotoCraft app on 127.0.0.1:$PORT after ${WAIT}s" >&2
        fi
        headless "$@"
        MCP
        chmod 0755 /usr/local/bin/photocraft /usr/local/bin/photocraft-mcp

    # Register the server with the sandbox's agent CLI at install time: install
    # commands finish during `sbx create`, before the CLI attaches, while startup
    # commands can fire after the session has already read its MCP config.
    - command: |
        set -e
        BIN_DIR="$HOME/.local/bin"
        mkdir -p "$BIN_DIR"
        cat > "$BIN_DIR/photocraft-mcp-register" <<'REGISTER'
        #!/bin/sh
        # Strictly additive: never remove-then-add. `claude mcp add` exits 1 on an
        # existing name, so a re-run is expected to fail and `|| true` leaves the
        # existing entry alone.
        PATH="$HOME/.local/bin:$HOME/.claude/local:/usr/local/share/npm-global/bin:$PATH"
        export PATH
        NAME=photocraft
        CMD=/usr/local/bin/photocraft-mcp

        if [ ! -x "$CMD" ]; then
          echo "photocraft-mcp-register: $CMD is missing" >&2
          exit 1
        fi

        found=0
        if command -v claude >/dev/null 2>&1; then
          found=1
          claude mcp add --scope user "$NAME" -- "$CMD" || true
          echo "photocraft-mcp-register: claude registration attempted for '$NAME'"
        fi
        if command -v codex >/dev/null 2>&1; then
          found=1
          codex mcp add "$NAME" -- "$CMD" || true
          echo "photocraft-mcp-register: codex registration attempted for '$NAME'"
        fi
        if [ "$found" -eq 0 ]; then
          echo "photocraft-mcp-register: no claude or codex CLI found, nothing to configure"
          echo "photocraft-mcp-register: launch manually with: $CMD"
        fi
        REGISTER
        chmod 0755 "$BIN_DIR/photocraft-mcp-register"
        "$BIN_DIR/photocraft-mcp-register"
      user: "agent"

  startup:
    # Fallback only; see the install-time registration above.
    - command:
        - sh
        - -c
        - /home/agent/.local/bin/photocraft-mcp-register >>/tmp/photocraft-mcp-register.log 2>&1 || true
      user: "agent"
      description: |
        Re-point the sandbox's agent CLI at the PhotoCraft MCP server. A no-op for
        agents without a CLI (such as the plain shell agent).

    - command:
        - setpriv
        - --reuid=1000
        - --regid=1000
        - --init-groups
        - /bin/sh
        - -c
        - |
          if [ -S /run/display/wayland-0 ]; then
            exec /usr/local/bin/photocraft >>/tmp/photocraft-startup.log 2>&1
          fi
          echo "no display; not starting the PhotoCraft window (MCP runs headless)" >>/tmp/photocraft-startup.log
      user: "0"
      background: true
      description: |
        Launch PhotoCraft as a Wayland client with its control channel on
        127.0.0.1:7878, when the sandbox was created with --display. Runs as
        root then drops to uid 1000 via setpriv. Backgrounded so the agent's
        terminal keeps focus; output goes to /tmp/photocraft-startup.log.

agentInstructions:
  content: |
    ## PhotoCraft

    PhotoCraft (image editing with layers, masks, type and PSD files, in the style
    of Photoshop) is installed, and its MCP server is registered as `photocraft`.
    The server's own `instructions` describe its tools; these notes cover how it is
    set up in this sandbox. Upstream: https://github.com/storytold/photocraft

    ### Which mode you are in

    The server logs its mode to stderr when it starts, and window-only tools say so
    when they fail:

    - **Connected** (sandbox has `--display`): you are driving the PhotoCraft window
      the user can see, over its control channel on 127.0.0.1:7878. Everything you
      do shows up live, and the window tools (screenshots, clicks, menus, dialogs)
      work.
    - **Headless** (no display, or the app was not up within 20 s of the MCP server
      starting): an in-process engine. All document tools work; the window tools
      return an error.

    If the user closed the window, the connected server cannot reach the app.
    Relaunch it with `photocraft >>/tmp/photocraft-startup.log 2>&1 &` from the shell; the
    server reconnects on the next call.

    ### Working well

    - Discover commands with the server's command-list tool and run them by id
      rather than guessing parameters.
    - Look at the result (the server's render or screenshot tool) after visual
      changes instead of assuming they worked.
    - File paths are RELATIVE to the workspace (`art/knight.pcraft`, not
      `/workspace/art/knight.pcraft`). PhotoCraft only lets automation touch files
      under its read and write roots, which this kit sets to the workspace; absolute
      paths, `..` and symlinks out of it are rejected. The parent folder of a new
      file must already exist, so create it from the shell first.
    - Save to the workspace so the user keeps the file.
    - The app's native file dialogs do not work in the sandbox. Never open
      Open/Save/Import dialogs through menus; use the path-taking tools instead.
    - The control channel is authenticated with the token in
      `/home/agent/.local/state/photocraft/control.token`. Never print or copy it.

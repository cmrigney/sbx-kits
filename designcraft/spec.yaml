schemaVersion: "2"
kind: mixin
name: designcraft
displayName: DesignCraft
permissions:
  network:
    allow:
      # Release tarball: github.com redirects to the release-assets CDN.
      - github.com:443
      - release-assets.githubusercontent.com:443
      - objects.githubusercontent.com:443
setup:
  install:
    # The prebuilt release links only against libc/libm/libgcc_s; everything
    # graphical is loaded with dlopen at runtime, so apt has to be told about it.
    # winit needs libwayland-client and libxkbcommon. The UI renders through
    # wgpu, and the sandbox has no GPU, so Mesa's lavapipe (mesa-vulkan-drivers)
    # supplies a software Vulkan device; the EGL/GL packages are wgpu's GL
    # fallback. All of this is only used when the sandbox has --display; the
    # headless MCP server needs none of it.
    - command: |
        set -eux
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y \
          ca-certificates \
          curl \
          libwayland-client0 \
          libwayland-cursor0 \
          libwayland-egl1 \
          libxkbcommon0 \
          libvulkan1 \
          mesa-vulkan-drivers \
          libegl1 \
          libegl-mesa0 \
          libgl1 \
          libgles2 \
          libgbm1 \
          libgl1-mesa-dri
        rm -rf /var/lib/apt/lists/*

    # DesignCraft from the upstream GitHub release. The Linux tarball ships both
    # the desktop app (`designcraft`) and the CLI (`designcraft-cli`) that hosts
    # the MCP server; there is no separate Linux CLI download. Pinned and
    # checksum-verified against the release's SHA256SUMS.txt.
    - command: |
        set -eux
        VERSION=0.4.0
        case "$(uname -m)" in
          aarch64|arm64) ARCH=aarch64 ;;
          x86_64|amd64)  ARCH=x86_64 ;;
          *) echo "designcraft: unsupported architecture $(uname -m)" >&2; exit 1 ;;
        esac
        NAME="designcraft-$VERSION-linux-$ARCH"
        BASE="https://github.com/storytold/designcraft/releases/download/v$VERSION"
        TMP=$(mktemp -d)
        curl -fsSL -o "$TMP/$NAME.tar.gz" "$BASE/$NAME.tar.gz"
        curl -fsSL -o "$TMP/SHA256SUMS.txt" "$BASE/SHA256SUMS.txt"
        (cd "$TMP" && grep " \*\?$NAME.tar.gz\$" SHA256SUMS.txt | sha256sum -c -)
        rm -rf /opt/designcraft
        mkdir -p /opt/designcraft
        tar -xzf "$TMP/$NAME.tar.gz" -C /opt/designcraft --strip-components=1 --no-same-owner
        rm -rf "$TMP"
        ln -sf /opt/designcraft/bin/designcraft-cli /usr/local/bin/designcraft-cli
        /usr/local/bin/designcraft-cli --version

    # Launchers. Written here rather than under `files:` because init files are
    # written after install commands run, and the MCP launcher has to exist
    # before the agent CLI is first started.
    #
    # `designcraft` opens the desktop app on the sandbox display with its JSON
    # control channel on loopback, which is what the MCP server's connected
    # mode talks to.
    #
    # `designcraft-mcp` is the command the agent CLI spawns. It picks the mode
    # when it starts: if the sandbox has a display it waits for the app's
    # control port and drives the live window (screenshots, menus, dialogs,
    # changes visible to the user); otherwise, or if the app never comes up, it
    # falls back to the in-process headless engine, which has every document
    # tool but no window tools. The CLI's connected mode fails fast when
    # nothing is listening, hence the wait.
    - command: |
        set -eux
        cat > /usr/local/bin/designcraft <<'LAUNCH'
        #!/bin/sh
        DISPLAY_DIR=/run/display
        DISPLAY_SOCK=wayland-0
        PORT="${DESIGNCRAFT_CONTROL_PORT:-7979}"
        if [ ! -S "$DISPLAY_DIR/$DISPLAY_SOCK" ]; then
          echo "designcraft: display socket not found at $DISPLAY_DIR/$DISPLAY_SOCK" >&2
          echo "This sandbox was not created with --display, so the desktop app cannot open." >&2
          echo "The MCP server still works headless (designcraft-cli mcp)." >&2
          echo "" >&2
          echo "To get the window, enable the experimental display feature and recreate:" >&2
          echo "  sbx settings set platform.allowExperimentalFeatures true" >&2
          echo "  sbx settings set feature.sandbox-display true" >&2
          echo "  sbx create --display --kit <this-kit> shell <workspace>" >&2
          exit 1
        fi
        HOME_DIR=$(getent passwd 1000 | cut -d: -f6)
        if [ -z "$HOME_DIR" ]; then
          echo "designcraft: no user at uid 1000" >&2
          exit 1
        fi
        export HOME="$HOME_DIR"
        # A relative WAYLAND_DISPLAY resolved against XDG_RUNTIME_DIR works on
        # every libwayland; bare absolute socket paths need libwayland >= 1.21.
        export XDG_RUNTIME_DIR="$DISPLAY_DIR"
        export WAYLAND_DISPLAY="$DISPLAY_SOCK"
        # The app switches to X11 whenever DISPLAY is set; there is no X server.
        unset DISPLAY
        export DESIGNCRAFT_WAYLAND=1
        LAUNCH_DIR="$WORKSPACE_DIR"
        if [ -z "$LAUNCH_DIR" ]; then LAUNCH_DIR="$HOME_DIR"; fi
        cd "$LAUNCH_DIR" || exit 1
        exec /opt/designcraft/bin/designcraft --control "$PORT" "$@"
        LAUNCH

        cat > /usr/local/bin/designcraft-mcp <<'MCP'
        #!/bin/bash
        # DESIGNCRAFT_MCP_MODE: auto (default), app, or headless.
        CLI=/opt/designcraft/bin/designcraft-cli
        PORT="${DESIGNCRAFT_CONTROL_PORT:-7979}"
        MODE="${DESIGNCRAFT_MCP_MODE:-auto}"
        WAIT="${DESIGNCRAFT_MCP_WAIT:-20}"

        port_open() { (exec 3<>"/dev/tcp/127.0.0.1/$PORT") 2>/dev/null; }

        if [ "$MODE" = headless ]; then
          exec "$CLI" mcp "$@"
        fi
        if [ "$MODE" = app ] || [ -S /run/display/wayland-0 ]; then
          for _ in $(seq "$WAIT"); do
            port_open && exec "$CLI" mcp --connect "$PORT" "$@"
            sleep 1
          done
          port_open && exec "$CLI" mcp --connect "$PORT" "$@"
          echo "designcraft-mcp: no DesignCraft app on 127.0.0.1:$PORT after ${WAIT}s; starting headless" >&2
        fi
        exec "$CLI" mcp "$@"
        MCP
        chmod 0755 /usr/local/bin/designcraft /usr/local/bin/designcraft-mcp

    # Register the server with the sandbox's agent CLI at install time, for the
    # same reason as the blender kit: install commands finish during
    # `sbx create`, before the CLI attaches, while startup commands can fire
    # after the session has already read its MCP config.
    - command: |
        set -e
        BIN_DIR="$HOME/.local/bin"
        mkdir -p "$BIN_DIR"
        cat > "$BIN_DIR/designcraft-mcp-register" <<'REGISTER'
        #!/bin/sh
        # Strictly additive: never remove-then-add. `claude mcp add` exits 1 on an
        # existing name, so a re-run is expected to fail and `|| true` leaves the
        # existing entry alone.
        PATH="$HOME/.local/bin:$HOME/.claude/local:/usr/local/share/npm-global/bin:$PATH"
        export PATH
        NAME=designcraft
        CMD=/usr/local/bin/designcraft-mcp

        if [ ! -x "$CMD" ]; then
          echo "designcraft-mcp-register: $CMD is missing" >&2
          exit 1
        fi

        found=0
        if command -v claude >/dev/null 2>&1; then
          found=1
          claude mcp add --scope user "$NAME" -- "$CMD" || true
          echo "designcraft-mcp-register: claude registration attempted for '$NAME'"
        fi
        if command -v codex >/dev/null 2>&1; then
          found=1
          codex mcp add "$NAME" -- "$CMD" || true
          echo "designcraft-mcp-register: codex registration attempted for '$NAME'"
        fi
        if [ "$found" -eq 0 ]; then
          echo "designcraft-mcp-register: no claude or codex CLI found, nothing to configure"
          echo "designcraft-mcp-register: launch manually with: $CMD"
        fi
        REGISTER
        chmod 0755 "$BIN_DIR/designcraft-mcp-register"
        "$BIN_DIR/designcraft-mcp-register"
      user: "agent"

  startup:
    # Fallback only; see the install-time registration above.
    - command:
        - sh
        - -c
        - /home/agent/.local/bin/designcraft-mcp-register >>/tmp/designcraft-mcp-register.log 2>&1 || true
      user: "agent"
      description: |
        Re-point the sandbox's agent CLI at the DesignCraft MCP server. A no-op
        for agents without a CLI (such as the plain shell agent).

    - command:
        - setpriv
        - --reuid=1000
        - --regid=1000
        - --init-groups
        - /bin/sh
        - -c
        - |
          if [ -S /run/display/wayland-0 ]; then
            exec /usr/local/bin/designcraft >>/tmp/designcraft-startup.log 2>&1
          fi
          echo "no display; not starting the DesignCraft window (MCP runs headless)" >>/tmp/designcraft-startup.log
      user: "0"
      background: true
      description: |
        Launch DesignCraft as a Wayland client with its control channel on
        127.0.0.1:7979, when the sandbox was created with --display. Runs as
        root then drops to uid 1000 via setpriv. Backgrounded so the agent's
        terminal keeps focus; output goes to /tmp/designcraft-startup.log.

agentInstructions:
  content: |
    ## DesignCraft

    DesignCraft (an open-source InDesign clone) is installed, and its MCP server
    is registered as `designcraft`. Upstream docs:
    https://github.com/storytold/designcraft/blob/main/docs/mcp.md

    ### Which mode you are in

    The server's `initialize` log line and tool errors tell you, but in short:

    - **Connected** (sandbox has `--display`): you are driving the app window
      the user can see. Everything you do shows up live. `screenshot`, `click`,
      `drag`, `menu_list`, `ui_inspect`, `ui_set` and `dialog_*` work.
    - **Headless** (no display, or the app was not up within 20 s of the MCP
      server starting): an in-process engine with an empty Letter document.
      All document tools work; the window tools return an error.

    If the user closed the window, the connected server cannot reach the app.
    Relaunch it with `designcraft >>/tmp/designcraft-startup.log 2>&1 &` from
    the shell; the server reconnects on the next call.

    ### Working well

    - Coordinates are points (1/72 in), y down, in spread space. A Letter page
      is 612 x 792. `inspect_document` lists page bounds and item ids.
    - Discover commands with `list_commands` (use `filter`) and run them with
      `execute`; use `batch` for several steps, with `"$N.path"` to reference
      earlier results (e.g. the id a `frame.create` returned).
    - Check your work visually with `render_page` (returns a PNG) after layout
      changes, and look for overset text in `inspect_document` / `get_story`.
    - Always pass ABSOLUTE paths for open/save/place/export. The app's working
      directory is the workspace, but the MCP server's may differ.
    - Save to the workspace so the user keeps the file: `save_document` writes
      native `.designcraft`; `execute file.exportPdf {path}` writes PDF;
      `export_png` writes a page image; IDML import/export is also available.
    - The app's native file dialogs do not work in the sandbox. Never open
      Open/Save/Place through menus; use the path-taking tools instead.
